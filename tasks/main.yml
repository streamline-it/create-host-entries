---
# create-host-entries
#
- name: ensure key variable(s) are defined
  ansible.builtin.assert:
    that: create_host_entries_host_file_host_entries
    fail_msg: "Make sure create_host_entries_host_file_host_entries has been defined."

- name: ensure hosts exist under /etc/hosts
  loop:
    "{{ create_host_entries_host_file_host_entries }}"
  when: ansible_fqdn not in create_host_entries_host_file_host_entries
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item }}"
    state: present
